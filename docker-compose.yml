services:
  postgres:
    image: postgres:17-alpine
    container_name: nba-props-postgres-clean
    restart: unless-stopped
    environment:
      POSTGRES_DB: nba_props
      POSTGRES_USER: nba_user
      POSTGRES_PASSWORD: nba_password
    ports:
      - "55432:5432"
    volumes:
      - nba_props_postgres_clean_data:/var/lib/postgresql/data

volumes:
  nba_props_postgres_clean_data: